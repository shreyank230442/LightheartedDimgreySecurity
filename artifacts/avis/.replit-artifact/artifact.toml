kind = "web"
previewPath = "/"
title = "AVIS — Agentic Visual Incident Investigation System"
version = "1.0.0"
id = "artifacts/avis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25600

[services.development]
run = "pnpm --filter @workspace/avis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/avis", "run", "build" ]
publicDir = "artifacts/avis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25600"
BASE_PATH = "/"
